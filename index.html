<!DOCTYPE html>
<html lang="ja">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script async 
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2347765292641921"
    crossorigin="anonymous">

  <style>
    /* ベース設定 */
    :root {
      --primary-color: #ff8ba7; /* 優しいピンク */
      --accent-color: #ffc6c7;  /* 薄いピンク */
      --text-color: #594a4e;    /* 茶色っぽいグレー */
      --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #fff 100%);
      --white: #ffffff;
    }

    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: var(--text-color);
      background: var(--bg-gradient);
      margin: 0;
      line-height: 1.6;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: 0.3s;
    }

    /* レイアウト */
    .container {
      max-width: 600px; /* スマホで見やすい幅 */
      margin: 0 auto;
      padding: 20px;
    }

    /* ヘッダー */
    header {
      text-align: center;
      padding: 40px 0 20px;
    }

    header h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: 2.5rem;
      color: var(--primary-color);
      margin: 0;
      letter-spacing: 0.1em;
      text-shadow: 2px 2px 4px rgba(255, 139, 167, 0.2);
    }
    
    header i {
      color: var(--primary-color);
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    /* メインセクション */
    .hero {
      background: var(--white);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(255, 139, 167, 0.15);
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
    }
    
    /* 装飾 */
    .hero::before {
      content: '';
      position: absolute;
      top: -50px;
      left: -50px;
      width: 100px;
      height: 100px;
      background: var(--accent-color);
      border-radius: 50%;
      opacity: 0.3;
    }

    .hero p {
      margin-bottom: 30px;
      font-size: 0.95rem;
    }

    /* おみくじボタン */
    .main-btn {
      display: inline-block;
      background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      color: white;
      font-weight: bold;
      padding: 18px 40px;
      border-radius: 50px;
      font-size: 1.1rem;
      box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
      position: relative;
      top: 0;
    }

    .main-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 117, 140, 0.6);
    }
    
    .main-btn i {
      margin-right: 8px;
    }

    /* セクション見出し */
    h2 {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.4rem;
      color: var(--primary-color);
      text-align: center;
      margin: 40px 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    h2::before, h2::after {
      content: '';
      display: block;
      width: 30px;
      height: 1px;
      background: var(--primary-color);
      margin: 0 15px;
    }

    /* リンクメニューのリスト */
    ul {
      list-style: none;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2列表示 */
      gap: 15px;
    }

    /* 人気コンテンツなどは1列にする場合 */
    .single-col ul {
      grid-template-columns: 1fr;
    }

    /* カード型リンク */
    li a {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: var(--white);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      border: 1px solid transparent;
    }

    li a:hover {
      border-color: var(--accent-color);
      color: var(--primary-color);
      transform: translateY(-2px);
    }
    
    li a i {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--accent-color);
    }

    /* 広告スペースのスタイル */
    .ad-space {
      margin: 30px 0;
      text-align: center;
      background: rgba(255,255,255,0.5);
      padding: 10px;
      border-radius: 10px;
    }

    /* フッター */
    footer {
      text-align: center;
      font-size: 0.8rem;
      margin-top: 50px;
      padding-bottom: 30px;
      color: #999;
    }
    
    footer a:hover {
      color: var(--primary-color);
    }

    /* スマホ調整 */
    @media (max-width: 480px) {
      header h1 { font-size: 2rem; }
      ul { grid-template-columns: 1fr; } /* スマホは1列 */
    }
  </style>
</head>
