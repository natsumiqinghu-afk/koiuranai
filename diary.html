---
layout: default
title: 育児日記一覧
---

<style>
  .breadcrumb {
    font-size: 0.85rem;
    color: #999;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .breadcrumb a {
    color: var(--primary-color);
  }

  .page-header {
    text-align: center;
    margin-bottom: 40px;
  }

  .page-header h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 2rem;
    color: var(--primary-color);
    margin: 0 0 10px 0;
  }

  .diary-list {
    display: grid;
    gap: 20px;
    margin-bottom: 30px;
  }

  .diary-card {
    background: var(--white);
    border-radius: 15px;
    padding: 25px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 1px solid transparent;
    transition: 0.3s;
  }

  .diary-card:hover {
    border-color: var(--accent-color);
    transform: translateY(-2px);
  }

  .date {
    font-size: 0.85rem;
    color: #999;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .diary-card h3 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.3rem;
    color: var(--primary-color);
    margin: 0 0 15px 0;
  }

  .diary-card p {
    font-size: 0.95rem;
    line-height: 1.8;
    margin-bottom: 15px;
  }

  .read-more {
    color: var(--primary-color);
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .read-more:hover {
    gap: 10px;
  }
</style>

<nav class="breadcrumb">
  <a href="{{ site.baseurl }}/">ホーム</a>
  <i class="fa-solid fa-chevron-right"></i>
  <span>育児日記</span>
</nav>

<div class="page-header">
  <h1>育児日記一覧</h1>
  <p>毎日の記録と成長の軌跡</p>
</div>

<div class="diary-list">
  {% for post in site.posts %}
  <article class="diary-card">
    <div class="date">
      <i class="fa-regular fa-calendar"></i>
      {{ post.date | date: "%Y年%-m月%-d日" }}
    </div>
    <h3>{{ post.title }}</h3>
    <p>{{ post.excerpt | strip_html | truncatewords: 50 }}</p>
    <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">
      続きを読む <i class="fa-solid fa-arrow-right"></i>
    </a>
  </article>
  {% endfor %}
</div>
