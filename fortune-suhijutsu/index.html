<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=<!-- Google AdSense -->

<title>💖 運命の数秘術・恋占い 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #ff8fab;
    --primary-dark: #fb6f92;
    --accent: #ffe5ec;
    --text: #594a4e;
    --white: #ffffff;
  }

  body {
    background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .wrap {
    background: var(--white);
    width: 100%;
    max-width: 480px;
    padding: 40px 30px;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(255, 107, 107, 0.15);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* 装飾用の背景円 */
  .wrap::before {
    content: '';
    position: absolute;
    top: -50px;
    left: -50px;
    width: 150px;
    height: 150px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.5;
    z-index: 0;
  }

  h1 {
    color: var(--primary-dark);
    font-size: 1.8rem;
    margin-bottom: 30px;
    position: relative;
    z-index: 1;
  }
  
  h1 span {
    display: inline-block;
    font-size: 1.2rem;
    color: #888;
    margin-top: 5px;
  }

  .input-group {
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
    text-align: left;
  }

  label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 8px;
    color: var(--primary-dark);
    font-weight: bold;
  }

  input {
    width: 100%;
    padding: 15px;
    font-size: 1.1rem;
    border: 2px solid #eee;
    border-radius: 12px;
    box-sizing: border-box; /* 崩れ防止 */
    outline: none;
    transition: all 0.3s ease;
    background: #fffbfc;
    font-family: inherit;
  }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(255, 143, 171, 0.2);
  }

  button {
    background: linear-gradient(to right, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    padding: 16px 40px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
    box-shadow: 0 4px 15px rgba(251, 111, 146, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    z-index: 1;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(251, 111, 146, 0.6);
  }

  button:active {
    transform: translateY(1px);
  }

  /* 結果表示エリア */
  .result {
    margin-top: 30px;
    padding: 30px 20px;
    border-radius: 16px;
    background: linear-gradient(to bottom, #fff0f6, #fff);
    border: 2px dashed var(--primary);
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: none; /* 初期状態は非表示 */
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .score-area {
    font-size: 3rem;
    color: var(--primary-dark);
    font-weight: bold;
    margin: 10px 0;
    text-shadow: 2px 2px 0px white;
  }
  
  .score-label {
    font-size: 1rem;
    color: #666;
  }

  .heart-beat {
    display: inline-block;
    color: #ff4d6d;
    animation: heartbeat 1.5s infinite;
  }

  @keyframes heartbeat {
    0% { transform: scale(1); }
    15% { transform: scale(1.3); }
    30% { transform: scale(1); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }

  .message {
    font-size: 1rem;
    line-height: 1.6;
    color: #555;
    margin-top: 15px;
    text-align: left;
    background: white;
    padding: 15px;
    border-radius: 10px;
  }

  .lucky-item {
    margin-top: 15px;
    font-size: 0.9rem;
    color: #888;
    background: #fff;
    padding: 10px;
    border-radius: 8px;
    display: inline-block;
  }

  /* ローディングアニメーション */
  .loader {
    display: none;
    margin: 20px auto;
  }
  .loader span {
    display: inline-block;
    width: 10px;
    height: 10px;
    background-color: var(--primary);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
    margin: 0 3px;
  }
  .loader span:nth-child(1) { animation-delay: -0.32s; }
  .loader span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>💘 運命の数秘術<br><span>Advanced Love Numerology</span></h1>
  
  <div class="input-group">
    <label for="name1">あなたの名前 (ローマ字)</label>
    <input id="name1" type="text" placeholder="例：Hanako" autocomplete="off">
  </div>

  <div class="input-group">
    <label for="name2">お相手の名前 (ローマ字)</label>
    <input id="name2" type="text" placeholder="例：Taro" autocomplete="off">
  </div>

  <button onclick="startDiagnosis()">✨ 二人の相性を占う ✨</button>

  <div id="loader" class="loader">
    <span></span><span></span><span></span>
  </div>

  <div id="result" class="result">
    <div class="score-label">二人の相性スコア</div>
    <div class="score-area"><span id="scoreValue">0</span>%</div>
    <div class="message" id="resultMessage"></div>
    <div class="lucky-item">
      🍀 ラッキーアクション：<span id="luckyAction" style="color:var(--primary-dark); font-weight:bold;"></span>
    </div>
  </div>
</div>

<script>
/**
 * 数秘術ロジック（ピタゴラス方式の簡易版）
 * A-Zを1-9に変換して足し合わせる
 */
function getNumberFromName(name) {
  const table = {
    a:1, j:1, s:1,
    b:2, k:2, t:2,
    c:3, l:3, u:3,
    d:4, m:4, v:4,
    e:5, n:5, w:5,
    f:6, o:6, x:6,
    g:7, p:7, y:7,
    h:8, q:8, z:8,
    i:9, r:9
  };

  const cleanName = name.toLowerCase().replace(/[^a-z]/g, '');
  if (!cleanName) return 0;

  let sum = 0;
  for (let char of cleanName) {
    sum += table[char] || 0;
  }

  // 1桁になるまで足す（11, 22などのマスターナンバーは今回簡易化のため考慮しつつ1桁へ）
  // ※より高度にする場合、ここで11,22を残すロジックに分岐可能
  while (sum > 9) {
    let tempSum = 0;
    String(sum).split('').forEach(n => tempSum += parseInt(n));
    sum = tempSum;
  }
  return sum;
}

function startDiagnosis() {
  const name1 = document.getElementById('name1').value;
  const name2 = document.getElementById('name2').value;
  const resultDiv = document.getElementById('result');
  const loader = document.getElementById('loader');

  // 入力チェック
  if (!name1 || !name2) {
    alert("お二人の名前をローマ字で入力してね🥺");
    return;
  }

  // リセット
  resultDiv.style.display = 'none';
  loader.style.display = 'block';

  // 演出のためのウェイト（1.5秒後に結果表示）
  setTimeout(() => {
    loader.style.display = 'none';
    calculateCompatibility(name1, name2);
    resultDiv.style.display = 'block';
  }, 1500);
}

function calculateCompatibility(n1, n2) {
  const num1 = getNumberFromName(n1);
  const num2 = getNumberFromName(n2);

  // 数秘術的相性ロジック（差分や特定の組み合わせでスコア変動）
  // 簡易的に「差が小さいほど似たもの同士」「特定の合計値が良い」などをミックス
  
  // 基本スコア：(9 - |数1 - 数2|) / 9 * 100 をベースにする
  let diff = Math.abs(num1 - num2);
  let baseScore = Math.floor(((9 - diff) / 9) * 100);

  // 補正ロジック（ランダム性を排除し、名前固有の結果になるように調整）
  // 名前自体の文字コード合計を使って微調整（同じ名前なら常に同じ結果にするため）
  const seed = (n1 + n2).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
  const adjustment = (seed % 20) - 10; // -10〜+10の調整
  
  let finalScore = baseScore + adjustment;
  
  // 特殊条件（数秘術で相性が良いとされる数字の組み合わせ例）
  const sum = num1 + num2;
  if ([3, 6, 9].includes(num1) && [3, 6, 9].includes(num2)) finalScore += 10; // 芸術肌ペア
  if ([1, 5, 7].includes(num1) && [1, 5, 7].includes(num2)) finalScore += 10; // 思考派ペア
  if ([2, 4, 8].includes(num1) && [2, 4, 8].includes(num2)) finalScore += 10; // 実務派ペア
  
  // 範囲制限
  if (finalScore > 100) finalScore = 100;
  if (finalScore < 30) finalScore = 30 + (seed % 20); // 最低保証

  // テキスト生成
  let msg = "";
  let action = "";

  if (finalScore >= 90) {
    msg = `すごい！運命的な相性です <span class="heart-beat">❤</span><br>お互いの考えていることが手に取るようにわかる、ソウルメイトのような関係。言葉にしなくても心が通じ合う最高のパートナーになれそう！`;
    action = "お気に入りのカフェでゆっくり話す";
  } else if (finalScore >= 75) {
    msg = `とても良い相性です✨<br>一緒にいると自然体でいられる、心地よい関係。お互いの違いを楽しみながら、素敵な信頼関係を築いていけます。`;
    action = "映画館デートやお家で映画鑑賞";
  } else if (finalScore >= 50) {
    msg = `これからの進展が楽しみな相性 🌱<br>最初は少し距離を感じるかもしれませんが、知れば知るほど惹かれ合う関係です。焦らずゆっくり育んで。`;
    action = "共通の趣味や話題を見つける";
  } else {
    msg = `刺激的な相性です⚡<br>全く違うタイプだからこそ、新しい発見がたくさん！自分にはない魅力にドキドキさせられる、ドラマチックな恋の予感。`;
    action = "相手の話を聞き役に徹してみる";
  }

  // 表示更新
  // スコアのアニメーション
  animateValue("scoreValue", 0, finalScore, 1000);
  
  document.getElementById('resultMessage').innerHTML = msg;
  document.getElementById('luckyAction').innerText = action;
}

// 数字のカウントアップアニメーション
function animateValue(id, start, end, duration) {
  let obj = document.getElementById(id);
  let range = end - start;
  let minTimer = 50;
  let stepTime = Math.abs(Math.floor(duration / range));
  stepTime = Math.max(stepTime, minTimer);
  let startTime = new Date().getTime();
  let endTime = startTime + duration;
  let timer;

  function run() {
    let now = new Date().getTime();
    let remaining = Math.max((endTime - now) / duration, 0);
    let value = Math.round(end - (remaining * range));
    obj.innerHTML = value;
    if (value == end) {
      clearInterval(timer);
    }
  }
  timer = setInterval(run, stepTime);
  run();
}
</script>
